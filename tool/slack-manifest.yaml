# Slack app manifest for the triage tool.
# The app's name inside the Slack workspace is "Innovative Bug Fixer".
# Paste this into api.slack.com/apps -> Create New App -> From a manifest (YAML tab).
display_information:
  name: Innovative Bug Fixer
  description: Reads customer reports in #support, finds the commit responsible, and fixes or hands off.
features:
  bot_user:
    display_name: Innovative Bug Fixer
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - channels:join
      - chat:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
