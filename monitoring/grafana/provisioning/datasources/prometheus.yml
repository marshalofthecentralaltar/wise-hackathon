apiVersion: 1

# The Prometheus kit from monitoring/start.mjs. Grafana only reads it; the tool never talks to
# Grafana.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
