<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account | Demo Bank</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="db-header">
    <div class="db-header-inner">
      <a class="db-brand" href="card.html">Demo Bank</a>
      <nav class="db-nav" aria-label="Main">
        <a class="db-nav-link" href="card.html">Card</a>
        <a class="db-nav-link" href="transfers.html">Transfers</a>
        <a class="db-nav-link db-nav-link-current" href="account.html" aria-current="page">Account</a>
      </nav>
    </div>
  </header>

  <main class="db-main">
    <h1 class="db-page-title">Account</h1>
    <p class="db-page-intro">Your details with Demo Bank.</p>

    <section class="db-panel" aria-label="Account details">
      <h2 class="db-section-title">Account details</h2>
      <dl class="db-details">
        <div class="db-detail-row">
          <dt class="db-detail-label">Account holder</dt>
          <dd class="db-detail-value"><span id="account-name">Anneli Tamm</span></dd>

        <div class="db-detail-row">
          <dt class="db-detail-label">Email</dt>
          <dd class="db-detail-value">anneli.tamm@example.com</dd>
        </div>
        <div class="db-detail-row">
          <dt class="db-detail-label">Postal address</dt>
          <dd class="db-detail-value">Näidise 12-7, 10000 Tallinn</dd>
        </div>
        <div class="db-detail-row">
          <dt class="db-detail-label">Language</dt>
          <dd class="db-detail-value">English</dd>
        </div>
      </dl>
    </section>
  </main>

</html>
